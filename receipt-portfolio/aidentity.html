<script>

class Component extends DCLogic {
  setRoot = (el) => { this.root = el; };
  setBg = (el) => { this.bg = el; };
  setCurtain = (el) => { this.curtain = el; };
  curtainTo = (pos, done) => {
    const cu = this.curtain;
    if (!cu) { if (done) done(); return; }
    cu.style.transition = 'transform .7s cubic-bezier(.7,0,.25,1)';
    cu.style.pointerEvents = pos === 0 ? 'auto' : 'none';
    requestAnimationFrame(() => { cu.style.transform = 'translateY(' + pos + '%)'; });
    if (done) setTimeout(done, 720);
  };
  clicks = [];
  setFx = (el) => { this.fx = el; };
  onDown = (e) => {
    const kinds = ['circle', 'half', 'square', 'star', 'tri', 'ring'];
    const greys = this.PAL.concat(['255,255,255']);
    const geo = [];
    const n = 5 + Math.floor(Math.random() * 2);
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
      geo.push({ k: kinds[Math.floor(Math.random() * kinds.length)], a: ang, d: 26 + Math.random() * 46, s: 5 + Math.random() * 8, r0: Math.random() * 6.28, rv: (Math.random() - 0.5) * 2.4, c: greys[Math.floor(Math.random() * greys.length)], dl: Math.random() * 0.12 });
    }
    this.clicks.push({ x: e.clientX, y: e.clientY, t0: performance.now(), geo: geo });
    if (this.clicks.length > 6) this.clicks.shift();
  };
  drawFx = (now) => {
    const c = this.fx;
    if (!c) return;
    this.clicks = this.clicks.filter((k) => now - k.t0 < 1700);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.round(window.innerWidth * dpr), H = Math.round(window.innerHeight * dpr);
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const ctx = c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!this.clicks.length) { if (this.fxOn) { ctx.clearRect(0, 0, W, H); this.fxOn = false; } return; }
    ctx.clearRect(0, 0, W, H);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (let i = 0; i < this.clicks.length; i++) {
      const k = this.clicks[i];
      const age = (now - k.t0) / 1000;
      const ew = 1 - Math.pow(1 - Math.min(1, age / 1.2), 3);
      const R = 10 + ew * 80, fade0 = 1 - ew;
      if (fade0 > 0.01) {
        const g = ctx.createRadialGradient(k.x, k.y, Math.max(0, R - 16), k.x, k.y, R + 8);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.6, 'rgba(255,255,255,' + (0.35 * fade0).toFixed(3) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(k.x, k.y, R + 8, 0, Math.PI * 2); ctx.fill();
      }
      for (let j = 0; j < k.geo.length; j++) {
        const gm = k.geo[j];
        const a2 = Math.max(0, age - gm.dl);
        if (a2 <= 0) continue;
        const pop = Math.min(1, a2 / 0.35);
        const sc = pop < 1 ? (1 - Math.pow(1 - pop, 3)) * 1.15 - 0.15 * pop * pop : 1;
        const e1 = 1 - Math.pow(1 - Math.min(1, a2 / 1.4), 3);
        const fade = Math.max(0, 1 - Math.max(0, a2 - 0.6) / 0.9);
        if (fade <= 0) continue;
        const s = gm.s * sc;
        ctx.save();
        ctx.translate(k.x + Math.cos(gm.a) * gm.d * e1, k.y + Math.sin(gm.a) * gm.d * e1 - a2 * 14);
        ctx.rotate(gm.r0 + gm.rv * e1);
        ctx.globalAlpha = 0.7 * fade;
        ctx.fillStyle = 'rgb(' + gm.c + ')';
        ctx.strokeStyle = 'rgba(120,116,108,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        if (gm.k === 'circle' || gm.k === 'ring') ctx.arc(0, 0, s / 2, 0, Math.PI * 2);
        else if (gm.k === 'half') ctx.arc(0, 0, s / 2, Math.PI, Math.PI * 2);
        else if (gm.k === 'square') ctx.rect(-s / 2, -s / 2, s, s);
        else if (gm.k === 'tri') { ctx.moveTo(0, -s / 2); ctx.lineTo(s / 2, s / 2); ctx.lineTo(-s / 2, s / 2); ctx.closePath(); }
        else { const r = s / 2, q = r * 0.22; ctx.moveTo(0, -r); ctx.quadraticCurveTo(q, -q, r, 0); ctx.quadraticCurveTo(q, q, 0, r); ctx.quadraticCurveTo(-q, q, -r, 0); ctx.quadraticCurveTo(-q, -q, 0, -r); }
        if (gm.k === 'ring') { ctx.lineWidth = 1.4; ctx.stroke(); } else { ctx.fill(); if (gm.c === '255,255,255') ctx.stroke(); }
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    this.fxOn = true;
  };

  GL = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*+=-/<>';
  scr = [];
  hash = (a, b) => { const x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return x - Math.floor(x); };

  SH = [
    { k: 'circle', x: 0.16, y: 0.2, r: 300, a: 0.5 }, { k: 'rect', x: 0.5, y: 0.05, w: 620, h: 260, a: 0.45 },
    { k: 'star', x: 0.86, y: 0.18, r: 190, a: 0.55 }, { k: 'rect', x: 0.66, y: 0.55, w: 320, h: 460, a: 0.4 },
    { k: 'half', x: 0.84, y: 0.85, r: 260, a: 0.45 }, { k: 'circle', x: 0.3, y: 0.86, r: 220, a: 0.45 },
    { k: 'quarter', x: 0.03, y: 1.0, r: 260, a: 0.5 }
  ];
  PAL = ['206,224,92', '170,166,156', '232,112,64'];

  drawBg = (now) => {
    const c = this.bg;
    if (!c) return;
    const W = Math.max(1, Math.round(window.innerWidth / 2)), H = Math.max(1, Math.round(window.innerHeight / 2));
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const ctx = c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const t = now * 0.001;
    const sy = (window.scrollY || 0) * 0.04;
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-0.5 + Math.sin(t * 0.05) * 0.04);
    ctx.translate(-W / 2, -H / 2);
    for (let i = 0; i < this.SH.length; i++) {
      const s = this.SH[i];
      const x = s.x * W + Math.sin(t * 0.11 + i * 1.7) * 18;
      const y = s.y * H + Math.cos(t * 0.09 + i * 2.3) * 14 - sy * (0.5 + (i % 3) * 0.3);
      const br = (1 + 0.05 * Math.sin(t * 0.17 + i)) * 0.5;
      ctx.save();
      ctx.translate(x, y); ctx.rotate(Math.sin(t * 0.06 + i) * 0.08); ctx.scale(br, br);
      ctx.fillStyle = 'rgba(' + this.PAL[i % 3] + ',' + s.a + ')';
      ctx.beginPath();
      if (s.k === 'circle') ctx.arc(0, 0, s.r, 0, Math.PI * 2);
      else if (s.k === 'half') ctx.arc(0, 0, s.r, Math.PI, Math.PI * 2);
      else if (s.k === 'quarter') { ctx.moveTo(0, 0); ctx.arc(0, 0, s.r, Math.PI, Math.PI * 1.5); ctx.closePath(); }
      else if (s.k === 'rect') ctx.rect(-s.w / 2, -s.h / 2, s.w, s.h);
      else { const r = s.r, q = r * 0.22; ctx.moveTo(0, -r); ctx.quadraticCurveTo(q, -q, r, 0); ctx.quadraticCurveTo(q, q, 0, r); ctx.quadraticCurveTo(-q, q, -r, 0); ctx.quadraticCurveTo(-q, -q, 0, -r); }
      ctx.fill();
      ctx.restore();
    }
  };

  scramble = (el, text, dur) => { this.scr.push({ el: el, text: text, t0: performance.now(), dur: dur }); };

  tick = (now) => {
    if (this.wheeling) {
      const y = window.scrollY || 0;
      if (this.lastSet != null && Math.abs(y - this.lastSet) > 3) { this.wheeling = false; this.lastSet = null; }
      else {
        const d = this.wheelY - y;
        if (Math.abs(d) < 0.5) { window.scrollTo(0, this.wheelY); this.wheeling = false; this.lastSet = null; }
        else { const ny = y + d * 0.14; window.scrollTo(0, ny); this.lastSet = window.scrollY || 0; }
      }
    }
    if (this.cnav) {
      const on = (window.scrollY || 0) > 140;
      if (on !== this.cnavOn) { this.cnavOn = on; this.cnav.style.transform = on ? 'translateY(0)' : 'translateY(-110%)'; }
    }
    this.drawBg(now);
    this.drawFx(now);
    if (this.scr.length) {
      const keep = [];
      for (let n = 0; n < this.scr.length; n++) {
        const a = this.scr[n];
        const k = (now - a.t0) / a.dur;
        if (k >= 1) { a.el.textContent = a.text; continue; }
        let out = '';
        for (let i = 0; i < a.text.length; i++) {
          const ch = a.text[i];
          if (ch === ' ') { out += ch; continue; }
          out += k >= (i / a.text.length) * 0.6 + this.hash(i, a.text.length) * 0.4 ? ch : this.GL[Math.floor(Math.random() * this.GL.length)];
        }
        a.el.textContent = out;
        keep.push(a);
      }
      this.scr = keep;
    }
    if (this.counts) {
      this.counts = this.counts.filter((ct) => {
        const k = Math.min(1, (now - ct.t0) / 1200);
        const e = 1 - Math.pow(1 - k, 3);
        ct.el.textContent = (ct.v * e).toFixed(ct.d);
        return k < 1;
      });
    }
    if (this.par) {
      const vh = window.innerHeight || 900;
      this.par.forEach((img) => {
        const f = img.closest('figure') || img;
        const r = f.getBoundingClientRect();
        const off = ((r.top + r.height / 2) - vh / 2) * -0.05;
        f.style.transform = 'translate3d(0,' + off.toFixed(1) + 'px,0)';
      });
    }
    this.raf = requestAnimationFrame(this.tick);
  };

  setupLightbox = () => {
    const root = this.root;
    if (!root || this.lb) return;
    const ov = document.createElement('div');
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', '圖片檢視：滾輪或雙指縮放、拖曳移動，點擊圖片外或按 Esc 關閉');
    ov.style.cssText = 'position:fixed;inset:0;z-index:30;display:none;cursor:zoom-out;touch-action:none;background:rgba(230,227,220,0);-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);transition:background .45s ease,backdrop-filter .45s ease,-webkit-backdrop-filter .45s ease';
    const im = document.createElement('img');
    im.alt = ''; im.draggable = false;
    im.style.cssText = 'position:fixed;left:0;top:0;max-width:none;transform-origin:0 0;background:#fdfcf9;box-shadow:0 30px 80px rgba(27,27,26,.22);will-change:transform;cursor:grab;user-select:none;-webkit-user-drag:none;touch-action:none';
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);display:flex;align-items:center;gap:2px;padding:4px;background:#fdfcf9;box-shadow:0 10px 30px rgba(27,27,26,.14);font-family:"IBM Plex Mono","Noto Sans TC",monospace;font-size:13px;color:#1b1b1a;opacity:0;transition:opacity .3s ease,transform .45s cubic-bezier(.2,.85,.25,1);cursor:default';
    const mk = (txt, label) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.setAttribute('aria-label', label); b.style.cssText = 'min-width:44px;height:40px;padding:0 10px;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer'; b.onmouseenter = () => { b.style.background = '#ece9e2'; }; b.onmouseleave = () => { b.style.background = 'transparent'; }; bar.appendChild(b); return b; };
    const bOut = mk('−', '縮小'), bPct = mk('100%', '重設大小'), bIn = mk('+', '放大'), bX = mk('✕', '關閉');
    bPct.style.minWidth = '64px';
    ov.appendChild(im); ov.appendChild(bar);
    document.body.appendChild(ov);
    const L = this.lb = { ov, im, src: null, open: false, w: 1, h: 1, x: 0, y: 0, z: 1, moved: 0 };
    const ease = 'transform .55s cubic-bezier(.2,.85,.25,1)';
    const apply = (anim) => {
      im.style.transition = anim ? 'transform .35s cubic-bezier(.2,.85,.25,1)' : 'none';
      im.style.transform = 'translate(' + L.x.toFixed(1) + 'px,' + L.y.toFixed(1) + 'px) scale(' + L.z.toFixed(4) + ')';
      bPct.textContent = Math.round(L.z * 100) + '%';
    };
    const center = () => { L.z = 1; L.x = (innerWidth - L.w) / 2; L.y = (innerHeight - L.h) / 2; };
    const zoomAt = (nz, px, py, anim) => {
      nz = Math.max(1, Math.min(6, nz));
      if (nz === 1) { center(); apply(anim); return; }
      L.x = px - (px - L.x) * (nz / L.z); L.y = py - (py - L.y) * (nz / L.z); L.z = nz;
      apply(anim);
    };
    const place = (r) => { im.style.transform = 'translate(' + r.left.toFixed(1) + 'px,' + r.top.toFixed(1) + 'px) scale(' + (r.width / L.w).toFixed(4) + ')'; };
    this.lbOpen = (img) => {
      const nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
      if (!nw || !nh) return;
      const s = Math.min(innerWidth * 0.92 / nw, (innerHeight - 110) * 0.94 / nh);
      L.w = nw * s; L.h = nh * s; L.src = img; L.open = true;
      im.src = img.currentSrc || img.src; im.alt = img.alt || '';
      im.style.width = L.w + 'px'; im.style.height = L.h + 'px';
      im.style.transition = 'none';
      ov.style.display = 'block';
      place(img.getBoundingClientRect());
      void im.offsetWidth;
      img.style.visibility = 'hidden';
      center();
      im.style.transition = ease;
      im.style.transform = 'translate(' + L.x.toFixed(1) + 'px,' + L.y.toFixed(1) + 'px) scale(1)';
      bPct.textContent = '100%';
      ov.style.background = 'rgba(230,227,220,.86)';
      ov.style.webkitBackdropFilter = ov.style.backdropFilter = 'blur(14px)';
      bar.style.opacity = '1'; bar.style.transform = 'translate(-50%,0)';
      setTimeout(() => { if (L.open) bX.focus({ preventScroll: true }); }, 60);
    };
    this.lbClose = () => {
      if (!L.open) return;
      L.open = false;
      const src = L.src;
      im.style.transition = ease;
      place(src.getBoundingClientRect());
      ov.style.background = 'rgba(230,227,220,0)';
      ov.style.webkitBackdropFilter = ov.style.backdropFilter = 'blur(0px)';
      bar.style.opacity = '0'; bar.style.transform = 'translate(-50%,12px)';
      setTimeout(() => { if (!L.open) { ov.style.display = 'none'; src.style.visibility = ''; } }, 560);
      try { src.focus({ preventScroll: true }); } catch (e) {}
    };
    this.lbWheel = (e) => {
      const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
      if (e.ctrlKey || Math.abs(dy) >= Math.abs(e.deltaX)) zoomAt(L.z * Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0016)), e.clientX, e.clientY, false);
      else { L.x -= e.deltaX; apply(false); }
    };
    ov.addEventListener('wheel', (e) => { e.preventDefault(); e.stopPropagation(); this.lbWheel(e); }, { passive: false });
    // drag + pinch
    const pts = new Map();
    let last = null, pinch = null;
    im.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      im.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      L.moved = 0; im.style.cursor = 'grabbing';
      if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: L.z }; last = null; }
      else last = { x: e.clientX, y: e.clientY };
    });
    im.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pinch && pts.size >= 2) {
        const [a, b] = [...pts.values()];
        zoomAt(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / (pinch.d || 1), (a.x + b.x) / 2, (a.y + b.y) / 2, false);
        L.moved += 10;
      } else if (last) {
        const dx = e.clientX - last.x, dy = e.clientY - last.y;
        L.moved += Math.abs(dx) + Math.abs(dy);
        L.x += dx; L.y += dy; last = { x: e.clientX, y: e.clientY };
        apply(false);
      }
    });
    const up = (e) => {
      pts.delete(e.pointerId);
      if (pts.size < 2) pinch = null;
      if (pts.size === 1) { const p = [...pts.values()][0]; last = { x: p.x, y: p.y }; } else last = null;
      im.style.cursor = 'grab';
      if (!pts.size && L.z <= 1.001 && L.moved > 0) { center(); apply(true); }
    };
    im.addEventListener('pointerup', up);
    im.addEventListener('pointercancel', up);
    im.addEventListener('click', (e) => e.stopPropagation());
    im.addEventListener('dblclick', (e) => { e.preventDefault(); e.stopPropagation(); zoomAt(L.z > 1.05 ? 1 : 2.5, e.clientX, e.clientY, true); });
