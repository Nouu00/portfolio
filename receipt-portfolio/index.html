::.:-:::::::::::-=+=--:::::\n.::::......=.:  .........:++#*+::-:::::::::::::----:::::\n.::::.....:=:.  ..........#%*+=.:-::::::::::::---:::::::\n.:::::......:.............%*#*#..-::::::::::---:::::::::\n.:::::.:...:::=--.........++**+..:::::::::---:::::::::::\n.::::::::..::----.........+--#@+:::::::::--:::::::::::::\n.:::::::..:::::::.........+-*%@*...::::---::::::::::::::\n.::::::..:::::::.... .....::::-::..:------::::::::::::::\n.:::::::::::::::::...........:::::::==--=-::::::::::::::\n.::::.:::::::::::::.:......::::::.:::---------------::::\n.::::::::::::::::::::::::::.::::::::=====--:::::::::::::\n=:::::::::::::::::::::::::::::::::::-------------=-:::::\n::::::::::::::::::::::::::::::::::::-==-=---::::::::::::\n.::::::::::::::::::::::::::::::::::::------==-:==-::::::\n.:==::::--::::-------::::::::::::::::::--------:::::::::\n.:=+:------:::-------:::::::::::::::::::--------::::::::"};

  scramble = (el, text, dur) => {
    if (!el) return;
    this.scr = this.scr.filter((a) => a.el !== el);
    this.scr.push({ el: el, text: text, t0: performance.now(), dur: dur || 600 });
  };

  stepScramble = (now) => {
    if (!this.scr.length) return;
    const keep = [];
    for (let n = 0; n < this.scr.length; n++) {
      const a = this.scr[n];
      const k = (now - a.t0) / a.dur;
      if (k >= 1) { a.el.textContent = a.text; continue; }
      let out = '';
      const L = a.text.length;
      for (let i = 0; i < L; i++) {
        const ch = a.text[i];
        if (ch === ' ' || ch === '\n') { out += ch; continue; }

      a.el.textContent = out;
      keep.push(a);

    this.scr = keep;

      D.on = false;

      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);

  stepBodies = (t, sc) => {
