<style>
body{margin:0;background:#ebebea}

@keyframes grainshift{0%{transform:translate(0,0)}25%{transform:translate(-4%,3%)}50%{transform:translate(3%,-5%)}75%{transform:translate(-6%,-2%)}100%{transform:translate(0,0)}}
.cgrain{animation:grainshift 1s steps(4) infinite}
.paper{background:#fdfcf9;box-shadow:0 1px 0 rgba(32,34,36,.04),0 18px 48px rgba(32,34,36,.10)}
.zz{-webkit-mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
[data-reveal]{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1),filter .9s ease;filter:blur(6px)}
[data-reveal].on{opacity:1;transform:none;filter:none}
[data-print]{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.65,0,.35,1)}
[data-print].on{clip-path:inset(0 0 0 0)}
.back:hover .arr{transform:translateX(-6px)}
.ln{transform:translateY(105%);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.on .ln{transform:none}

.arr{display:inline-block;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.next:hover .arr2{transform:translateX(6px)}
.arr2{display:inline-block;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){[data-reveal],[data-print]{opacity:1;transform:none;filter:none;clip-path:none;transition:none}.cgrain{animation:none}}
</style>

<body>
<div id="app"></div>
<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
  setRoot = (el) => { this.root = el; };
  setBg = (el) => { this.bg = el; };
  clicks = [];
  setFx = (el) => { this.fx = el; };
  onDown = (e) => {
    const kinds = ['circle', 'half', 'square', 'star', 'tri', 'ring'];
    const greys = ['32,34,36', '120,122,125', '180,182,184', '255,255,255'];
    const geo = [];
    const n = 7 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
      geo.push({ k: kinds[Math.floor(Math.random() * kinds.length)], a: ang, d: 60 + Math.random() * 110, s: 8 + Math.random() * 18, r0: Math.random() * 6.28, rv: (Math.random() - 0.5) * 2.4, c: greys[Math.floor(Math.random() * greys.length)], dl: Math.random() * 0.12 });
    }
    this.clicks.push({ x: e.clientX, y: e.clientY, t0: performance.now(), geo: geo });
    if (this.clicks.length > 6) this.clicks.shift();
  };
  drawFx = (now) => {
    const c = this.fx;
    if (!c) return;
    this.clicks = this.clicks.filter((k) => now - k.t0 < 1700);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = Math.round(window.innerWidth * dpr), H = Math.round(window.innerHeight * dpr);
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const ctx = c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (!this.clicks.length) { if (this.fxOn) { ctx.clearRect(0, 0, W, H); this.fxOn = false; } return; }
    ctx.clearRect(0, 0, W, H);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (let i = 0; i < this.clicks.length; i++) {
      const k = this.clicks[i];
      const age = (now - k.t0) / 1000;
      const ew = 1 - Math.pow(1 - Math.min(1, age / 1.2), 3);
      const R = 16 + ew * 150, fade0 = 1 - ew;
      if (fade0 > 0.01) {
        const g = ctx.createRadialGradient(k.x, k.y, Math.max(0, R - 30), k.x, k.y, R + 12);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.6, 'rgba(255,255,255,' + (0.35 * fade0).toFixed(3) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(k.x, k.y, R + 12, 0, Math.PI * 2); ctx.fill();
      }
      for (let j = 0; j < k.geo.length; j++) {
        const gm = k.geo[j];
        const a2 = Math.max(0, age - gm.dl);
        if (a2 <= 0) continue;
        const pop = Math.min(1, a2 / 0.35);
        const sc = pop < 1 ? (1 - Math.pow(1 - pop, 3)) * 1.15 - 0.15 * pop * pop : 1;
        const e1 = 1 - Math.pow(1 - Math.min(1, a2 / 1.4), 3);
        const fade = Math.max(0, 1 - Math.max(0, a2 - 0.6) / 0.9);
        if (fade <= 0) continue;
        const s = gm.s * sc;
        ctx.save();
        ctx.translate(k.x + Math.cos(gm.a) * gm.d * e1, k.y + Math.sin(gm.a) * gm.d * e1 - a2 * 14);
        ctx.rotate(gm.r0 + gm.rv * e1);
        ctx.globalAlpha = 0.85 * fade;
        ctx.fillStyle = 'rgb(' + gm.c + ')';
        ctx.strokeStyle = 'rgba(32,34,36,0.55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        if (gm.k === 'circle' || gm.k === 'ring') ctx.arc(0, 0, s / 2, 0, Math.PI * 2);
        else if (gm.k === 'half') ctx.arc(0, 0, s / 2, Math.PI, Math.PI * 2);
        else if (gm.k === 'square') ctx.rect(-s / 2, -s / 2, s, s);
        else if (gm.k === 'tri') { ctx.moveTo(0, -s / 2); ctx.lineTo(s / 2, s / 2); ctx.lineTo(-s / 2, s / 2); ctx.closePath(); }
        else { const r = s / 2, q = r * 0.22; ctx.moveTo(0, -r); ctx.quadraticCurveTo(q, -q, r, 0); ctx.quadraticCurveTo(q, q, 0, r); ctx.quadraticCurveTo(-q, q, -r, 0); ctx.quadraticCurveTo(-q, -q, 0, -r); }
        if (gm.k === 'ring') { ctx.lineWidth = 1.4; ctx.stroke(); } else { ctx.fill(); if (gm.c === '255,255,255') ctx.stroke(); }
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    this.fxOn = true;
  };

  GL = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*+=-/<>';
  scr = [];
  hash = (a, b) => { const x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return x - Math.floor(x); };

  SH = [
    { k: 'circle', x: 0.16, y: 0.2, r: 300, a: 0.5 }, { k: 'rect', x: 0.5, y: 0.05, w: 620, h: 260, a: 0.45 },
    { k: 'star', x: 0.86, y: 0.18, r: 190, a: 0.55 }, { k: 'rect', x: 0.66, y: 0.55, w: 320, h: 460, a: 0.4 },
    { k: 'half', x: 0.84, y: 0.85, r: 260, a: 0.45 }, { k: 'circle', x: 0.3, y: 0.86, r: 220, a: 0.45 },
    { k: 'quarter', x: 0.03, y: 1.0, r: 260, a: 0.5 }
  ];
  PAL = ['200,202,204', '216,217,218', '184,187,190'];

  drawBg = (now) => {
    const c = this.bg;
    if (!c) return;
    const W = Math.max(1, Math.round(window.innerWidth / 2)), H = Math.max(1, Math.round(window.innerHeight / 2));
    if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
    const ctx = c.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const t = now * 0.001;
    const sy = (window.scrollY || 0) * 0.04;
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-0.5 + Math.sin(t * 0.05) * 0.04);
    ctx.translate(-W / 2, -H / 2);
    for (let i = 0; i < this.SH.length; i++) {
      const s = this.SH[i];
      const x = s.x * W + Math.sin(t * 0.11 + i * 1.7) * 18;
      const y = s.y * H + Math.cos(t * 0.09 + i * 2.3) * 14 - sy * (0.5 + (i % 3) * 0.3);
      const br = (1 + 0.05 * Math.sin(t * 0.17 + i)) * 0.5;
      ctx.save();
      ctx.translate(x, y); ctx.rotate(Math.sin(t * 0.06 + i) * 0.08); ctx.scale(br, br);
      ctx.fillStyle = 'rgba(' + this.PAL[i % 3] + ',' + s.a + ')';
      ctx.beginPath();
      if (s.k === 'circle') ctx.arc(0, 0, s.r, 0, Math.PI * 2);
      else if (s.k === 'half') ctx.arc(0, 0, s.r, Math.PI, Math.PI * 2);
      else if (s.k === 'quarter') { ctx.moveTo(0, 0); ctx.arc(0, 0, s.r, Math.PI, Math.PI * 1.5); ctx.closePath(); }
      else if (s.k === 'rect') ctx.rect(-s.w / 2, -s.h / 2, s.w, s.h);
      else { const r = s.r, q = r * 0.22; ctx.moveTo(0, -r); ctx.quadraticCurveTo(q, -q, r, 0); ctx.quadraticCurveTo(q, q, 0, r); ctx.quadraticCurveTo(-q, q, -r, 0); ctx.quadraticCurveTo(-q, -q, 0, -r); }
      ctx.fill();
      ctx.restore();
    }
  };

  scramble = (el, text, dur) => { this.scr.push({ el: el, text: text, t0: performance.now(), dur: dur }); };

  tick = (now) => {
    this.drawBg(now);
    this.drawFx(now);
    if (this.scr.length) {
      const keep = [];
      for (let n = 0; n < this.scr.length; n++) {
        const a = this.scr[n];
        const k = (now - a.t0) / a.dur;
        if (k >= 1) { a.el.textContent = a.text; continue; }
        let out = '';
        for (let i = 0; i < a.text.length; i++) {
          const ch = a.text[i];
          if (ch === ' ') { out += ch; continue; }
          out += k >= (i / a.text.length) * 0.6 + this.hash(i, a.text.length) * 0.4 ? ch : this.GL[Math.floor(Math.random() * this.GL.length)];
        }
        a.el.textContent = out;
        keep.push(a);
      }
      this.scr = keep;
    }
    if (this.counts) {
      this.counts = this.counts.filter((ct) => {
        const k = Math.min(1, (now - ct.t0) / 1200);
        const e = 1 - Math.pow(1 - k, 3);
        ct.el.textContent = (ct.v * e).toFixed(ct.d);
        return k < 1;
      });
    }
    if (this.par) {
      const vh = window.innerHeight || 900;
      this.par.forEach((img) => {
        const f = img.closest('figure') || img;
        const r = f.getBoundingClientRect();
        const off = ((r.top + r.height / 2) - vh / 2) * -0.05;
        f.style.transform = 'translate3d(0,' + off.toFixed(1) + 'px,0)';
      });
    }
    this.raf = requestAnimationFrame(this.tick);
  };

  componentDidMount() {
    this.raf = requestAnimationFrame(this.tick);
    if (!this.root) return;
    this.par = Array.prototype.slice.call(this.root.querySelectorAll('[data-par]'));
    this.counts = [];
    const els = Array.prototype.slice.call(this.root.querySelectorAll('[data-reveal], [data-print], [data-bar], [data-scr], [data-count]'));
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const show = (el) => {
      el.classList.add('on');
      if (el.hasAttribute('data-bar')) el.style.width = el.getAttribute('data-bar') + '%';
      if (reduce) return;
      if (el.hasAttribute('data-scr')) this.scramble(el, el.textContent, 700);
      if (el.hasAttribute('data-count')) this.counts.push({ el: el, v: parseFloat(el.getAttribute('data-count')), d: parseInt(el.getAttribute('data-dec') || '0', 10), t0: performance.now() });
    };
    if (typeof IntersectionObserver === 'undefined') { els.forEach(show); return; }
    this.io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) { show(en.target); this.io.unobserve(en.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    els.forEach((el) => this.io.observe(el));
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    if (this.io) this.io.disconnect();
  }

  renderVals() {
    return { setRoot: this.setRoot, setBg: this.setBg, setFx: this.setFx, onDown: this.onDown };
  }
}

DCLite.mount(Component, {}, "\n<div ref=\"{{setRoot}}\" onPointerDown=\"{{onDown}}\" style=\"position: relative; min-height: 100vh; overflow-x: hidden; background: #ebebea; color: #202224; font-family: 'Noto Sans TC', 'Inter Tight', sans-serif\">\n\n<canvas ref=\"{{setFx}}\" aria-hidden=\"true\" style=\"position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 6\"></canvas>\n<canvas ref=\"{{setBg}}\" aria-hidden=\"true\" style=\"position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0\"></canvas>\n<div aria-hidden=\"true\" style=\"position: fixed; inset: 0; pointer-events: none; z-index: 0; background: rgba(235,235,234,0.42); -webkit-backdrop-filter: blur(34px) saturate(1.05); backdrop-filter: blur(34px) saturate(1.05)\"></div>\n<div aria-hidden=\"true\" style=\"position: fixed; inset: -50%; width: 200%; height: 200%; pointer-events: none; z-index: 5; opacity: 0.26; mix-blend-mode: multiply\">\n<svg class=\"cgrain\" style=\"width: 100%; height: 100%; display: block\"><filter id=\"cg\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"0.85\" numOctaves=\"3\" stitchTiles=\"stitch\"></feTurbulence><feColorMatrix type=\"saturate\" values=\"0\"></feColorMatrix></filter><rect width=\"100%\" height=\"100%\" filter=\"url(#cg)\"></rect></svg>\n</div>\n\n<header style=\"position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 28px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase\">\n<a class=\"back\" href=\"index.html\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 44px; text-decoration: none\"><span class=\"arr\" aria-hidden=\"true\">\u2190</span>\u56de\u5230\u6536\u64da</a>\n</header>\n\n<main style=\"position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 0 40px 120px; display: flex; flex-direction: column; gap: 120px\">\n<section data-reveal=\"1\" style=\"display: flex; flex-direction: column; gap: 48px; padding-top: 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 20px\">\n<h1 style=\"margin: 0; font-family: 'Inter Tight', 'Noto Sans TC', sans-serif; font-weight: 300; font-size: clamp(56px, 9vw, 128px); line-height: 0.98; letter-spacing: -0.045em\"><span style=\"display: block; overflow: hidden; padding-bottom: 0.06em\"><span class=\"ln\" style=\"display: block; transition-delay: 0.00s\">Tabelog</span></span><span style=\"display: block; overflow: hidden; padding-bottom: 0.06em\"><span class=\"ln\" style=\"display: block; transition-delay: 0.12s\">Redesign</span></span></h1>\n<p style=\"margin: 0; max-width: 640px; font-size: 20px; line-height: 1.7; font-weight: 300\">\u8b93\u8d74\u65e5\u81ea\u7531\u884c\u7684\u53f0\u7063\u65c5\u5ba2\uff0c\u66f4\u5feb\u627e\u5230\u60f3\u5403\u7684\u9910\u5ef3\u2014\u2014\u5f9e\u5546\u696d\u6307\u6a19\u5f80\u4e0b\u62c6\u7684 UX \u500b\u6848\u7814\u7a76\u3002</p>\n</div>\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start\">\n<div class=\"paper zz\" style=\"flex: 1 1 300px; max-width: 380px; min-width: 0; box-sizing: border-box; padding: 40px 28px 28px; font-family: 'IBM Plex Mono', 'Noto Sans TC', monospace; font-size: 13px; line-height: 1.7\">\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 16px; text-align: center\"><span style=\"font-family: 'Inter Tight', 'Noto Sans TC', sans-serif; font-weight: 500; font-size: 22px; letter-spacing: -0.01em\" data-scr=\"1\">Tabelog \u518d\u8a2d\u8a08</span><span style=\"font-size: 11px; letter-spacing: 0.24em; color: #7a7d81\">PROJECT RECEIPT</span></div>\n<div style=\"display: flex; flex-direction: column; gap: 12px; border-top: 1px dashed #202224; padding-top: 16px\"><div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"color: #7a7d81; font-size: 11px; let
